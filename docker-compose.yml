services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dados:
    build: ./servico-dados
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  processamento:
    build: ./servico-processamento
    environment:
      DADOS_URL: http://dados:5000
    depends_on:
      - dados
    ports:
      - "5001:5001"

  relatorio:
    build: ./servico-relatorio
    environment:
      DADOS_URL: http://dados:5000
      PROCESSAMENTO_URL: http://processamento:5001
    depends_on:
      - dados
      - processamento
    ports:
      - "8000:8000"

volumes:
  dbdata: